<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableaux CSV</title>
<!-- Lecteur de CSV local (01_inventory.csv, 02_easy_clean.csv, notes_viewer.csv…).
     Aucun serveur, aucune requête réseau : les fichiers sont lus par le navigateur. -->
<style>
:root {
  color-scheme: dark;
  --bg: #121211; --panel: #1a1a19; --panel-2: #232321; --line: #34332f;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c84; --accent: #3987e5;
  --good: #4fb286; --bad: #e66767; --warn: #c98500;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 3; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
a { color: var(--accent); }
button, select, input[type=search], input[type=text] { background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; }
button { cursor: pointer; } button:hover { border-color: var(--muted); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.tabs .x { margin-left: 6px; opacity: .7; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.cols { position: relative; }
.cols summary { list-style: none; cursor: pointer; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 10px; }
.cols summary::-webkit-details-marker { display: none; }
.cols .pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px; max-height: 60vh; overflow-y: auto; min-width: 240px; z-index: 5;
  box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.cols label { display: block; padding: 2px 0; white-space: nowrap; }
.wrap { overflow: auto; height: calc(100vh - 54px); }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 100%; }
th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
  text-align: left; vertical-align: top; }
td { max-width: 380px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.wrapcells td { white-space: normal; word-break: break-word; }
thead th { position: sticky; background: var(--panel); z-index: 2; }
thead tr.h th { top: 0; cursor: pointer; white-space: nowrap; font-weight: 600; color: var(--text-2); }
thead tr.f th { top: 29px; padding: 3px 4px; }
thead tr.f input, thead tr.f select { width: 100%; min-width: 70px; padding: 2px 4px; font-size: 12px; }
tbody tr:hover td { background: var(--panel-2); }
td.t { color: var(--good); } td.f { color: var(--bad); font-weight: 600; }
td.err { color: var(--warn); }
td.num { text-align: right; }
.drop { margin: 60px auto; max-width: 560px; padding: 40px; border: 2px dashed var(--line); border-radius: 12px;
  text-align: center; color: var(--text-2); }
.drop.over, body.over .drop { border-color: var(--accent); }
.drop p { margin: 8px 0; }
@media (max-width: 700px) { header { position: static; } .wrap { height: auto; } }
</style>
</head>
<body>
<header>
  <h1>Tableaux CSV</h1>
  <button id="open" title="Un CSV hors de RESULTS (ex. notes_viewer.csv téléchargé)">+ Autre CSV…</button>
  <input type="file" id="file" accept=".csv,.tsv,text/csv" multiple hidden>
  <div class="tabs" id="tabs"></div>
  <span class="spacer"></span>
  <input type="search" id="q" placeholder="Rechercher dans toutes les colonnes…" style="min-width:240px">
  <span class="muted" id="count"></span>
  <button id="reset" title="Effacer les filtres et le tri">Effacer les filtres</button>
  <label class="muted"><input type="checkbox" id="wrapcells"> Texte complet</label>
  <details class="cols" id="colsBox"><summary>Colonnes ▾</summary><div class="pop" id="cols"></div></details>
  <a href="index.html">← Viewer</a>
</header>
<div class="wrap" id="wrap"></div>

<!-- CSV de RESULTS/, recopiés par build_tables.py ; paramètre unique : jamais servi depuis le cache -->
<script>document.write('<script src="data/tables.js?t=' + Date.now() + '"><\/script>');</script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STORE = "tables.files";  // CSV ouverts à la main, gardés dans ce navigateur (si la taille le permet)

// tables : { nom: { cols, rows, sort: [col, dir], filters: {}, hidden: Set, q, src: "results" | "local", date } }
let T = {}, cur = null;

// ---------------------------------------------------------------- lecture CSV (guillemets, ; ou ,)
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/, 1)[0];
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" :
              first.includes("\t") && !first.includes(",") ? "\t" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  const cols = rows.shift() || [];
  return { cols, rows: rows.filter(r => r.length > 1 || r[0] !== "") };
}
function addTable(name, text, src = "local", date = "") {
  const { cols, rows } = parseCSV(text);
  // colonnes entièrement vides : masquées par défaut
  const hidden = new Set(cols.map((c, j) => rows.every(r => !r[j]) ? j : -1).filter(j => j >= 0));
  T[name] = { cols, rows, text, sort: null, filters: {}, hidden, q: "", src, date };
  cur = name;
}
function persist() {  // seulement les CSV ouverts à la main : ceux de RESULTS sont relus à chaque ouverture
  const local = Object.entries(T).filter(([, t]) => t.src === "local").map(([k, t]) => [k, t.text]);
  try { localStorage.setItem(STORE, JSON.stringify(Object.fromEntries(local))); }
  catch (e) { /* trop gros ou indisponible : la page marche sans */ }
}
function readFiles(files) {
  const list = [...files].filter(f => /\.(csv|tsv|txt)$/i.test(f.name));
  let left = list.length; if (!left) return;
  list.forEach(f => {
    const r = new FileReader();
    r.onload = () => { addTable(f.name, r.result); if (--left === 0) { persist(); render(); } };
    r.readAsText(f, "utf-8");
  });
}

// ---------------------------------------------------------------- affichage
const isNum = v => v !== "" && !isNaN(v);
function visibleRows(t) {
  const q = t.q.toLowerCase();
  let rows = t.rows.filter(r => {
    if (q && !r.some(v => v.toLowerCase().includes(q))) return false;
    for (const [j, f] of Object.entries(t.filters)) {
      if (f.exact != null) { if ((r[j] || "") !== f.exact) return false; }
      else if (f.text && !(r[j] || "").toLowerCase().includes(f.text.toLowerCase())) return false;
    }
    return true;
  });
  if (t.sort) {
    const [j, dir] = t.sort;
    rows = rows.slice().sort((a, b) => {
      const x = a[j] || "", y = b[j] || "";
      const c = isNum(x) && isNum(y) ? x - y : x.localeCompare(y, "fr", { numeric: true });
      return c * dir;
    });
  }
  return rows;
}
function cellClass(col, v) {
  if (v === "True" || v === "gardé") return "t";
  if (v === "False" || v === "exclu") return "f";
  if (/error|reason|detail/i.test(col) && v) return "err";
  return isNum(v) ? "num" : "";
}
function renderTabs() {
  $("tabs").innerHTML = Object.entries(T).map(([n, t]) => t.src === "results"
    ? `<button data-n="${esc(n)}" class="${n === cur ? "on" : ""}" title="RESULTS/${esc(n)} · modifié le ${esc(t.date)}">${esc(n)}</button>`
    : `<button data-n="${esc(n)}" class="${n === cur ? "on" : ""}" title="Ouvert à la main">${esc(n)}<span class="x" title="Fermer">✕</span></button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = e => {
    if (e.target.classList.contains("x")) { delete T[b.dataset.n]; if (cur === b.dataset.n) cur = Object.keys(T)[0] || null; persist(); }
    else cur = b.dataset.n;
    render();
  });
}
function renderCols(t) {
  $("cols").innerHTML = t.cols.map((c, j) =>
    `<label><input type="checkbox" data-j="${j}" ${t.hidden.has(j) ? "" : "checked"}> ${esc(c)}</label>`).join("");
  $("cols").querySelectorAll("input").forEach(cb => cb.onchange = () => {
    cb.checked ? t.hidden.delete(+cb.dataset.j) : t.hidden.add(+cb.dataset.j); renderTable();
  });
}
function render() {
  renderTabs();
  const t = T[cur];
  try { if (cur) localStorage.setItem("tables.current", cur); } catch (e) {}  // onglet rouvert la prochaine fois
  if (!t) {
    $("count").textContent = ""; $("cols").innerHTML = "";
    $("wrap").innerHTML = `<div class="drop" id="drop"><p><b>Aucun CSV de RESULTS trouvé</b></p>
      <p>Lancer <code>python ANALYSIS/viewer/build_tables.py</code> puis recharger la page.</p>
      <p class="muted">On peut aussi glisser un CSV ici ou utiliser « + Autre CSV… » (ex. <code>notes_viewer.csv</code>).
      Les fichiers restent sur l'ordinateur.</p></div>`;
    return;
  }
  $("q").value = t.q;
  renderCols(t); renderTable();
}
function renderTable() {
  const t = T[cur], cols = t.cols.map((c, j) => j).filter(j => !t.hidden.has(j));
  const rows = visibleRows(t);
  $("count").textContent = `${rows.length} / ${t.rows.length} lignes`;
  // filtre par colonne : liste déroulante si peu de valeurs différentes, sinon texte
  const filt = j => {
    const vals = [...new Set(t.rows.map(r => r[j] || ""))];
    const f = t.filters[j] || {};
    if (vals.length <= 15) return `<select data-j="${j}"><option value="__all">(tout)</option>` +
      vals.sort((a, b) => a.localeCompare(b, "fr", { numeric: true })).map(v =>
        `<option value="${esc(v)}" ${f.exact === v ? "selected" : ""}>${v === "" ? "(vide)" : esc(v)}</option>`).join("") + "</select>";
    return `<input type="text" data-j="${j}" placeholder="filtrer" value="${esc(f.text || "")}">`;
  };
  const arrow = j => t.sort && t.sort[0] === j ? (t.sort[1] > 0 ? " ▲" : " ▼") : "";
  const MAX = 3000;
  $("wrap").innerHTML = `<table><thead>
    <tr class="h">${cols.map(j => `<th data-j="${j}" title="Trier">${esc(t.cols[j])}${arrow(j)}</th>`).join("")}</tr>
    <tr class="f">${cols.map(j => `<th>${filt(j)}</th>`).join("")}</tr></thead>
    <tbody>${rows.slice(0, MAX).map(r => `<tr>${cols.map(j => {
      const v = r[j] || "";
      return `<td class="${cellClass(t.cols[j], v)}" title="${esc(v)}">${esc(v)}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table>` +
    (rows.length > MAX ? `<p class="muted" style="padding:8px 16px">${MAX} premières lignes affichées : filtrer pour voir les autres.</p>` : "");
  $("wrap").querySelectorAll("tr.h th").forEach(th => th.onclick = () => {
    const j = +th.dataset.j;
    t.sort = t.sort && t.sort[0] === j ? (t.sort[1] > 0 ? [j, -1] : null) : [j, 1];
    renderTable();
  });
  $("wrap").querySelectorAll("tr.f select").forEach(s => s.onchange = () => {
    const j = s.dataset.j;
    if (s.value === "__all") delete t.filters[j]; else t.filters[j] = { exact: s.value };
    renderTable();
  });
  $("wrap").querySelectorAll("tr.f input").forEach(inp => inp.onchange = () => {
    const j = inp.dataset.j;
    if (inp.value) t.filters[j] = { text: inp.value }; else delete t.filters[j];
    renderTable();
  });
}

// ---------------------------------------------------------------- événements
$("open").onclick = () => $("file").click();
$("wrapcells").onchange = e => document.body.classList.toggle("wrapcells", e.target.checked);
$("file").onchange = e => { readFiles(e.target.files); e.target.value = ""; };
$("q").oninput = () => { if (T[cur]) { T[cur].q = $("q").value; renderTable(); } };
$("reset").onclick = () => { const t = T[cur]; if (!t) return; t.q = ""; t.filters = {}; t.sort = null; render(); };
document.addEventListener("click", e => { if (!$("colsBox").contains(e.target)) $("colsBox").open = false; });
["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); document.body.classList.remove("over"); }));
document.addEventListener("drop", e => readFiles(e.dataTransfer.files));

(window.RESULTS_TABLES || []).forEach(t => addTable(t.name, t.text, "results", t.date));
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || "{}");
  Object.entries(saved).forEach(([n, txt]) => { if (!T[n]) addTable(n, txt); });
} catch (e) {}
let last = null;
try { last = localStorage.getItem("tables.current"); } catch (e) {}
cur = T[last] ? last : Object.keys(T)[0] || null;
render();
</script>
</body>
</html>
